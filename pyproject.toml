[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "labelohlcv"
version = "0.1.0"
description = "Utilities for labeling OHLCV market data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "labelohlcv contributors" }
]
keywords = ["ohlcv", "trading", "data", "labeling", "quant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.3.3",
]

[project.scripts]
labelohlcv = "labelohlcv.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

